[package]
name = "my-little-db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
tracing-subscriber = {  version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"]}
xxhash-rust = {  version = "0.8.15", features = ["xxh3", "const_xxh3"] }